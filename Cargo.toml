[package]
name = "TREOVL"
version = "1.0.0"
edition = "2024"
build = "build.rs"

[lib]
name = "TREOVL"
path = "src/lib.rs"

[[bin]]
name = "TREOVL"
path = "src/main.rs"

[features]
default = ["gui"]
gui = [
    "dep:slint",
    "dep:slint-build",
    "dep:wgpu",
    "dep:pollster",
    "dep:rfd",
]

[dependencies]
slint = { version = "1.18.1", optional = true }
byteorder = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crc32fast = "1.5.2"
rayon = "1.12.0"
rfd = { version = "0.17.2", optional = true }
flate2 = "1.1.10"
hex = "0.4.3"
walkdir = "2.5.0"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
wgpu = { version = "30.0.1", optional = true }
pollster = { version = "1.0.1", optional = true }
glam = "0.34.0"
tempfile = "3.27.0"
parking_lot = "0.12.5"

[build-dependencies]
slint-build = { version = "1.18.1", optional = true }
